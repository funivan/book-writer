name: Validate JavaScript

on:
  push:
    branches: [main]
    paths:
      - '**/*.js'
      - '**/*.mjs'
  pull_request:
    paths:
      - '**/*.js'
      - '**/*.mjs'
  merge_group:

jobs:
  syntax-check:
    name: Node Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          exit_code=0
          while IFS= read -r -d '' file; do
            echo "::group::Checking $file"
            # Plugin files are ES modules; parse them as such.
            if node --input-type=module --check < "$file"; then
              echo "PASS: $file"
            else
              echo "FAIL: $file"
              exit_code=1
            fi
            echo "::endgroup::"
          done < <(find . -path ./node_modules -prune -o \( -name '*.js' -o -name '*.mjs' \) -type f -print0 | sort -z)
          exit $exit_code
