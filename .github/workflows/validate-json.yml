name: Validate JSON

on:
  push:
    branches: [main]
    paths:
      - '**/*.json'
  pull_request:
    paths:
      - '**/*.json'
  merge_group:

jobs:
  validate-json:
    name: JSON Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate JSON
        run: |
          exit_code=0
          while IFS= read -r -d '' file; do
            echo "::group::Validating $file"
            if python3 -m json.tool "$file" > /dev/null; then
              echo "PASS: $file"
            else
              echo "FAIL: $file"
              exit_code=1
            fi
            echo "::endgroup::"
          done < <(find . -name '*.json' -type f -print0 | sort -z)
          exit $exit_code
